<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* Chat-specific styles */
    .app { display: flex; height: 100vh; overflow: hidden; }
    .sidebar {
      width: 280px;
      background: #111;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      flex-shrink: 0;
    }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .sidebar-header h2 { font-size: 1.2rem; font-weight: 600; }
    .new-chat-btn {
      background: #8ab4f8;
      color: #0a0a0a;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .new-chat-btn:hover { background: #7aa8e8; }
    .convo-list { flex: 1; overflow-y: auto; }
    .convo-item {
      padding: 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.25rem;
    }
    .convo-item:hover { background: #1a1a1a; }
    .convo-item.active { background: #2a2a2a; }
    .convo-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .convo-item .delete-btn { color: #666; padding: 0 0.25rem; }
    .convo-item .delete-btn:hover { color: #f87171; }
    .sidebar-footer {
      border-top: 1px solid #2a2a2a;
      padding-top: 1rem;
      margin-top: 1rem;
    }
    .user-menu { display: flex; justify-content: space-between; align-items: center; }
    .user-info { font-size: 0.9rem; }
    .user-info .name { font-weight: 600; }
    .user-info .email { color: #888; font-size: 0.8rem; }
    .logout-btn { color: #888; font-size: 0.9rem; }
    .logout-btn:hover { color: #f87171; }

    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0a0a;
    }
    .chat-header {
      padding: 1rem 2rem;
      border-bottom: 1px solid #2a2a2a;
      background: #0f0f0f;
    }
    .chat-header h1 { font-size: 1.2rem; font-weight: 500; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }
    .message.user {
      align-self: flex-end;
      background: #8ab4f8;
      color: #0a0a0a;
    }
    .message.assistant {
      align-self: flex-start;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
    }
    .message .role { font-size: 0.7rem; text-transform: uppercase; opacity: 0.6; margin-bottom: 0.25rem; }
    .typing-indicator {
      align-self: flex-start;
      background: #1a1a1a;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      display: none;
    }
    .typing-indicator span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #666;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .input-area {
      padding: 1rem 2rem;
      border-top: 1px solid #2a2a2a;
      background: #0f0f0f;
      display: flex;
      gap: 0.75rem;
    }
    .input-area textarea {
      flex: 1;
      padding: 0.75rem;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #e0e0e0;
      resize: none;
      font-family: inherit;
      font-size: 1rem;
      min-height: 48px;
      max-height: 150px;
    }
    .input-area textarea:focus { outline: none; border-color: #8ab4f8; }
    .input-area .send-btn {
      padding: 0 1.5rem;
      background: #8ab4f8;
      color: #0a0a0a;
      border-radius: 8px;
      font-weight: 600;
      align-self: flex-end;
      height: 48px;
    }
    .input-area .send-btn:hover { background: #7aa8e8; }
    .input-area .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
    }
    .empty-state h2 { font-size: 2rem; margin-bottom: 0.5rem; color: #888; }
    .empty-state p { font-size: 1.1rem; }

    /* Mobile */
    .sidebar-toggle { display: none; background: none; color: #e0e0e0; font-size: 1.5rem; }
    @media (max-width: 768px) {
      .sidebar { position: fixed; left: -280px; top: 0; bottom: 0; z-index: 100; transition: left 0.3s; }
      .sidebar.open { left: 0; }
      .sidebar-toggle { display: block; }
      .chat-header { display: flex; align-items: center; gap: 0.75rem; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Chats</h2>
        <button class="new-chat-btn" id="newChatBtn">+ New</button>
      </div>
      <div class="convo-list" id="convoList"></div>
      <div class="sidebar-footer">
        <div class="user-menu">
          <div class="user-info">
            <div class="name" id="userName">User</div>
            <div class="email" id="userEmail">email@example.com</div>
          </div>
          <button class="logout-btn" id="logoutBtn">Log out</button>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main-chat">
      <header class="chat-header">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        <h1 id="chatTitle">New Chat</h1>
      </header>
      <div class="messages" id="messages">
        <div class="empty-state" id="emptyState">
          <h2>What can I help with?</h2>
          <p>Start typing below.</p>
        </div>
        <div class="typing-indicator" id="typingIndicator">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="input-area">
        <textarea id="messageInput" rows="1" placeholder="Type a message..." disabled></textarea>
        <button class="send-btn" id="sendBtn" disabled>Send</button>
      </div>
    </main>
  </div>
  <script src="/script.js"></script>
</body>
</html>
