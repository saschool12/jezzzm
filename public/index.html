<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Jhonny AI</title>
<link rel="stylesheet" href="/style.css">
<meta name="theme-color" content="#080808">
</head>

<body>

<div class="app">

<div class="background-effects">
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="grid-background"></div>
</div>

<aside class="sidebar" id="sidebar">

<div class="sidebar-top">

<div class="brand">
<div class="brand-logo">J</div>

<div class="brand-text">
<strong>Jhonny</strong>
<span>AI Assistant</span>
</div>
</div>

<button class="new-chat-btn" id="newChatBtn" type="button">
<span class="plus">+</span>
<span>New chat</span>
</button>

</div>

<div class="history-section">

<div class="history-title">
<span>Recent chats</span>
</div>

<div class="convo-list" id="convoList"></div>

</div>

<div class="sidebar-footer">

<div class="user-card">

<div class="user-avatar">
<span id="userInitial">U</span>
</div>

<div class="user-info">

<div class="name" id="userName">
User
</div>

<div class="email" id="userEmail">
email@example.com
</div>

</div>

<button class="logout-btn" id="logoutBtn" type="button">
<span>↪</span>
</button>

</div>

</div>

</aside>

<main class="main-chat">

<header class="chat-header">

<button class="sidebar-toggle" id="sidebarToggle" type="button">
<span></span>
<span></span>
<span></span>
</button>

<div class="chat-heading">

<div class="status-dot"></div>

<div>
<h1 id="chatTitle">New Chat</h1>
<span class="online-status">Jhonny AI is ready</span>
</div>

</div>

<div class="header-actions">

<button class="header-btn" id="headerNewChat" type="button">
+
</button>

</div>

</header>
<section class="messages" id="messages">

<div class="empty-state" id="emptyState">

<div class="hero-icon">

<div class="hero-icon-inner">
J
</div>

<div class="hero-ring ring-one"></div>
<div class="hero-ring ring-two"></div>

</div>

<h2>How can I help you?</h2>

<p>
Ask Jhonny anything and start a conversation.
</p>

<div class="suggestions">

<button type="button"
class="suggestion"
data-prompt="Explain something to me simply">

<span class="suggestion-icon">✦</span>
<span>Explain something</span>

</button>

<button type="button"
class="suggestion"
data-prompt="Help me write something">

<span class="suggestion-icon">✎</span>
<span>Help me write</span>

</button>

<button type="button"
class="suggestion"
data-prompt="Help me with coding">

<span class="suggestion-icon">&lt;/&gt;</span>
<span>Help with coding</span>

</button>

</div>

</div>

<div class="typing-indicator" id="typingIndicator">

<div class="typing-avatar">J</div>

<div class="typing-content">

<span class="typing-text">
Jhonny is thinking
</span>

<div class="typing-dots">
<span></span>
<span></span>
<span></span>
</div>

</div>

</div>

</section>

<div class="input-wrapper">

<div class="input-glow"></div>

<div class="input-area">

<textarea
id="messageInput"
rows="1"
placeholder="Message Jhonny..."
disabled></textarea>

<button
class="send-btn"
id="sendBtn"
type="button"
disabled>

<span class="send-icon">↑</span>

</button>

</div>

<div class="input-footer">
<span>
Jhonny can make mistakes. Check important information.
</span>
</div>

</div>

</main>

</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script src="/script.js"></script>

</body>
</html>
<script src="script.js"></script>
<script src="mobile-fix.js"></script>

</body>
</html>
