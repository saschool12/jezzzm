<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login - Jhonny AI</title>
<link rel="stylesheet" href="/style.css">
<meta name="theme-color" content="#070707">
</head>

<body class="auth-page">

<div class="auth-background">

<div class="auth-glow auth-glow-one"></div>
<div class="auth-glow auth-glow-two"></div>

<div class="auth-grid"></div>

</div>

<main class="auth-container">

<div class="auth-brand">

<div class="auth-logo">
J
</div>

<div class="auth-brand-text">
<strong>Jhonny</strong>
<span>AI Assistant</span>
</div>

</div>

<div class="auth-card">

<div class="auth-card-top">

<div class="auth-icon">
↗
</div>

<h1>Welcome back</h1>

<p>
Sign in to continue chatting with Jhonny AI.
</p>

</div>

<form id="loginForm">

<div class="auth-form-group">

<label for="email">
Email address
</label>

<div class="auth-input">

<span class="input-icon">@</span>

<input
type="email"
id="email"
placeholder="you@example.com"
autocomplete="email"
required
>

</div>

</div>

<div class="auth-form-group">

<div class="password-label">

<label for="password">
Password
</label>

<a href="/forgot-password.html">
Forgot password?
</a>

</div>

<div class="auth-input">

<span class="input-icon">•</span>

<input
type="password"
id="password"
placeholder="Enter your password"
autocomplete="current-password"
required
minlength="8"
>

</div>

</div>

<div id="error" class="error"></div>

<button
type="submit"
class="auth-submit"
>

<span>Sign in</span>

<span class="submit-arrow">
→
</span>

</button>

<div class="auth-divider">
<span>or</span>
</div>

<div class="auth-bottom">

Don't have an account?

<a href="/register.html">
Create one
</a>

</div>

</form>

</div>

<div class="auth-footer">
Jhonny AI · Your personal AI assistant
</div>

</main>

<script src="/script.js"></script>

</body>
</html>
