<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password - Jhonny AI</title>
<link rel="stylesheet" href="/style.css">
<meta name="theme-color" content="#070707">
</head>

<body class="auth-page">

<div class="auth-background">

<div class="auth-glow auth-glow-one"></div>
<div class="auth-glow auth-glow-two"></div>

<div class="auth-grid"></div>

</div>

<main class="auth-container">

<div class="auth-brand">

<div class="auth-logo">
J
</div>

<div class="auth-brand-text">
<strong>Jhonny</strong>
<span>AI Assistant</span>
</div>

</div>

<div class="auth-card">

<div class="auth-card-top">

<div class="auth-icon">
↻
</div>

<h1>Reset your password</h1>

<p>
Enter your email and we'll send you a reset link.
</p>

</div>

<form id="forgotForm">

<div class="auth-form-group">

<label for="email">
Email address
</label>

<div class="auth-input">

<span class="input-icon">@</span>

<input
type="email"
id="email"
placeholder="you@example.com"
autocomplete="email"
required
>

</div>

</div>

<div id="error" class="error"></div>

<div id="success" class="success"></div>

<button
type="submit"
class="auth-submit"
>

<span>Send reset link</span>

<span class="submit-arrow">
→
</span>

</button>

<div class="auth-bottom">

Remember your password?

<a href="/login.html">
Back to sign in
</a>

</div>

<div class="auth-bottom secondary-link">

Don't have an account?

<a href="/register.html">
Create one
</a>

</div>

</form>

</div>

<div class="auth-footer">
Jhonny AI · Your personal AI assistant
</div>

</main>

<script src="/script.js"></script>

</body>
</html>
